  #contentCard{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.88);
    border-radius:18px;
    padding:20px 16px 8px;
    max-width:560px;

    min-width:170px;

    min-height:1.2em;
    font-size:0.9rem;
    text-align:center;
    margin-bottom:10px;

    font-size:1.1rem;
    margin:28px 0 14px;
    text-align:center;

    display:grid;
    grid-template-columns:max-content max-content max-content;
    gap:14px 36px;
    margin:0 auto 20px;
    padding:0 8px;
    justify-content:center;

    align-items:center;
    gap:10px;
    font-size:1rem;
    line-height:1.4;

    height:14px;
    border-radius:50%;
    border:1.5px solid #666;
    flex-shrink:0;

  .wb-item.done{

  .wb-item.done .dot{

    border-color:var(--accent);

  }
  @media (max-width:420px){
    #wordBank{ grid-template-columns:max-content; }

<body>

<div id="splatterBg"></div>

<div id="contentCard">
<h1>Anyways&hellip; (Word Search)</h1>
<p class="instructions">Somewhere in this grid are fifteen things that live in this book. Words run left&ndash;right, top&ndash;bottom, and diagonally &mdash; forwards or backwards. Click and drag (or swipe) across a word to find it. Your progress saves automatically on this device.</p>

<div id="gridWrap">
  <div id="grid"></div>
</div>

<div id="status"></div>

<div id="controls">
  <button id="revealBtn">Reveal All</button>
  <button id="resetBtn">Clear &amp; Start Over</button>
</div>

<div id="wordBankTitle">Find These Words</div>
<div id="wordBank"></div>
</div>

<script>
const GRID_ROWS = ["DOORVAJKHZGFAWMBE","QTMDRHZGHOSTDUCKS","SQUIRRELXGQWIEOLT","PQHNIMNLOANYWAYSE","NSTAIRSNSBESYZKPP","WKGGPRHWGRGZTRPIE","EVFEHCFPKDAESEMCN","SIVTTMMOYDQNJEUAC","AMBBOHSRLIXHTVNZI","NKACOKBTLSWFFPTOL","IRCHLSXFDOKCWDIFN","TEFSSAFOFRGMYCTVU","YSUPZKGLCDBTYBLPB","SFFWPEEIXETEKXEHE","JVORBLOOJROKGQDJM","KOHCXBJGVLVWQCQXQ","WEBSITECLYBFOLDER"];
const WORDS = ["ANYWAYS","DISORDERLY","DOOR","FOLDER","GHOSTDUCKS","PENCILNUB","PORTFOLIO","RANT","SANITY","SQUIRREL","STAIRS","TOOLS","UFO","UNTITLED","WEBSITE"];
// Precomputed [row, col, dRow, dCol] start + direction for each word (verified against the grid above)
const SOLUTIONS = {"ANYWAYS":[3,9,0,1],"DISORDERLY":[7,9,1,0],"DOOR":[0,0,0,1],"FOLDER":[16,11,0,1],"GHOSTDUCKS":[1,7,0,1],"PENCILNUB":[4,16,1,0],"PORTFOLIO":[6,7,1,0],"RANT":[5,9,1,1],"SANITY":[7,0,1,0],"SQUIRREL":[2,0,0,1],"STAIRS":[4,1,0,1],"TOOLS":[7,4,1,0],"UFO":[12,2,1,0],"UNTITLED":[7,14,1,0],"WEBSITE":[16,0,0,1]};

const H = GRID_ROWS.length, W = GRID_ROWS[0].length;
const STORAGE_KEY = 'wordSearchSave_findTheChaos_v1';

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${W}, auto)`;
gridEl.style.gridTemplateRows = `repeat(${H}, auto)`;

// Size cells to the real measured width so the grid never overflows
// (no horizontal scroll needed, so touch-action:none on the wrap can't trap it)
function sizeGrid(){
  const wrap = document.getElementById('gridWrap');
  const available = wrap.clientWidth;
  const chrome = (W - 1) * 1 + 6; // gaps + border
  let cell = Math.floor((available - chrome) / W);
  cell = Math.max(14, Math.min(26, cell));
  const font = Math.max(9, Math.round(cell * 0.58));
  document.documentElement.style.setProperty('--cell-size', cell + 'px');
  document.documentElement.style.setProperty('--cell-font', font + 'px');
}
window.addEventListener('resize', sizeGrid);
window.addEventListener('orientationchange', () => setTimeout(sizeGrid, 50));

const cellEls = []; // [r][c] -> div
for (let r = 0; r < H; r++){
  const row = [];
  for (let c = 0; c < W; c++){
    const div = document.createElement('div');
    div.className = 'letter';
    div.textContent = GRID_ROWS[r][c];
    div.dataset.r = r;
    div.dataset.c = c;
    gridEl.appendChild(div);
    row.push(div);
  }
  cellEls.push(row);
}
sizeGrid();

function cellsForSolution(word){
  const [r, c, dr, dc] = SOLUTIONS[word];
  const cells = [];
  for (let i = 0; i < word.length; i++){
    cells.push([r + dr*i, c + dc*i]);
  }
  return cells;
}

const found = {}; // word -> true

// --- Word bank ---
const wbEl = document.getElementById('wordBank');
const sortedWords = WORDS.slice().sort();
const wbItems = {};
sortedWords.forEach(word => {
  const item = document.createElement('div');
  item.className = 'wb-item';
  const dot = document.createElement('span');
  dot.className = 'dot';
  const span = document.createElement('span');
  span.textContent = word;
  item.appendChild(dot);
  item.appendChild(span);
  wbEl.appendChild(item);
  wbItems[word] = item;
});

function markFound(word){
  found[word] = true;
  wbItems[word].classList.add('done');
  cellsForSolution(word).forEach(([r,c]) => cellEls[r][c].classList.add('found'));
  const allDone = WORDS.every(w => found[w]);
  document.getElementById('status').textContent = allDone ? "Found every word \u2014 nicely done." : '';
  saveProgress();
}

// --- Selection (mouse + touch via Pointer Events) ---
let selecting = false;
let startCell = null;
let currentPath = [];
let wrongCells = [];

function clearWrongHighlight(){
  wrongCells.forEach(([r,c]) => cellEls[r][c].classList.remove('wrong'));
  wrongCells = [];
}

function clearSelectingHighlight(){
  currentPath.forEach(([r,c]) => {
    if (!isCellPermanentlyFound(r,c)) cellEls[r][c].classList.remove('selecting');
  });
  currentPath = [];
}

function isCellPermanentlyFound(r, c){
  return cellEls[r][c].classList.contains('found');
}

function cellFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  if (el && el.classList.contains('letter')) return el;
  return null;
}

function straightLine(r0, c0, r1, c1){
  const dr = r1 - r0, dc = c1 - c0;
  const stepR = Math.sign(dr), stepC = Math.sign(dc);
  if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return null; // not a straight line
  const len = Math.max(Math.abs(dr), Math.abs(dc)) + 1;
  const path = [];
  for (let i = 0; i < len; i++){
    path.push([r0 + stepR*i, c0 + stepC*i]);
  }
  return path;
}

function updateSelection(r1, c1){
  clearSelectingHighlight();
  const path = straightLine(startCell[0], startCell[1], r1, c1);
  if (!path) return;
  currentPath = path;
  path.forEach(([r,c]) => {
    if (!isCellPermanentlyFound(r,c)) cellEls[r][c].classList.add('selecting');
  });
}

function pathLetters(path){
  return path.map(([r,c]) => GRID_ROWS[r][c]).join('');
}

function finishSelection(){
  if (currentPath.length > 1){
    const letters = pathLetters(currentPath);
    const reversed = letters.split('').reverse().join('');
    const match = WORDS.find(w => (w === letters || w === reversed) && !found[w]);
    if (match){
      markFound(match);
      clearSelectingHighlight();
    } else {
      // stays red/orange until the person starts their next selection
      wrongCells = currentPath.slice();
      clearSelectingHighlight();
      wrongCells.forEach(([r,c]) => {
        if (!isCellPermanentlyFound(r,c)) cellEls[r][c].classList.add('wrong');
      });
    }
  } else {
    clearSelectingHighlight();
  }
  selecting = false;
  startCell = null;
}

gridEl.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.letter');
  if (!el) return;
  e.preventDefault();
  clearWrongHighlight();
  selecting = true;
  startCell = [parseInt(el.dataset.r), parseInt(el.dataset.c)];
  currentPath = [[startCell[0], startCell[1]]];
  if (!isCellPermanentlyFound(...startCell)) el.classList.add('selecting');
  gridEl.setPointerCapture(e.pointerId);
});

gridEl.addEventListener('pointermove', (e) => {
  if (!selecting) return;
  e.preventDefault();
  const el = cellFromPoint(e.clientX, e.clientY);
  if (!el) return;
  updateSelection(parseInt(el.dataset.r), parseInt(el.dataset.c));
});

gridEl.addEventListener('pointerup', (e) => {
  if (!selecting) return;
  finishSelection();
});
gridEl.addEventListener('pointercancel', () => {
  if (!selecting) return;
  clearSelectingHighlight();
  selecting = false;
  startCell = null;
});

// --- Reveal / Reset ---
document.getElementById('revealBtn').addEventListener('click', () => {
  if (!confirm('This will reveal every word. Continue?')) return;
  WORDS.forEach(w => { if (!found[w]) markFound(w); });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Clear all found words and start over?')) return;
  WORDS.forEach(w => {
    delete found[w];
    wbItems[w].classList.remove('done');
  });
  cellEls.forEach(row => row.forEach(el => el.classList.remove('found','selecting','wrong')));
  wrongCells = [];
  document.getElementById('status').textContent = '';
  localStorage.removeItem(STORAGE_KEY);
});

// --- Autosave / load ---
function saveProgress(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.keys(found))); } catch(e){}
}
function loadProgress(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const words = JSON.parse(raw);
    words.forEach(w => { if (WORDS.includes(w)) markFound(w); });
  } catch(e){}
}
loadProgress();
</script>
